:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #e3e8ed;
  --border: #ccd3da;
  --text: #1b2330;
  --text-dim: #5e6b7a;
  --accent: #c9531a;
  --accent-strong: #a8430f;
  --accent-soft: #fbe4d3;
  --ok: #2f8f5b;
  --ok-soft: #dcefe3;
  --warn: #b9840f;
  --warn-soft: #f8ecd2;
  --blocked: #c23b2c;
  --blocked-soft: #f8ddd7;
  --neutral: #8994a3;
  --neutral-soft: #e6e9ed;
  --shadow: 0 1px 2px rgba(20,26,34,0.06), 0 8px 24px -12px rgba(20,26,34,0.18);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141b;
    --surface: #1a212b;
    --surface-2: #212a35;
    --border: #2c3542;
    --text: #eef1f5;
    --text-dim: #96a1b1;
    --accent: #ef8a34;
    --accent-strong: #ffab5e;
    --accent-soft: #3a2416;
    --ok: #4bb87b;
    --ok-soft: #16301f;
    --warn: #eeab2e;
    --warn-soft: #332405;
    --blocked: #e8624c;
    --blocked-soft: #3a1c16;
    --neutral: #8390a3;
    --neutral-soft: #232a35;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}

:root[data-theme="dark"] {
  --bg: #10141b;
  --surface: #1a212b;
  --surface-2: #212a35;
  --border: #2c3542;
  --text: #eef1f5;
  --text-dim: #96a1b1;
  --accent: #ef8a34;
  --accent-strong: #ffab5e;
  --accent-soft: #3a2416;
  --ok: #4bb87b;
  --ok-soft: #16301f;
  --warn: #eeab2e;
  --warn-soft: #332405;
  --blocked: #e8624c;
  --blocked-soft: #3a1c16;
  --neutral: #8390a3;
  --neutral-soft: #232a35;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 0.9375rem;
  line-height: 1.5;
  margin: 0;
  padding: 2.5rem 1.5rem 4rem;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 74rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 2.5rem;
}

/* ---------- Header / HUD strip ---------- */

header.masthead {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.title-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

h1 {
  font-family: 'Oswald', system-ui, sans-serif;
  font-weight: 600;
  font-size: 1.875rem;
  letter-spacing: 0.01em;
  margin: 0;
  text-wrap: balance;
}

h1 .org {
  color: var(--text-dim);
  font-weight: 500;
}

.meta {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: 0.75rem;
  color: var(--text-dim);
  text-align: right;
  line-height: 1.6;
}

.meta strong { color: var(--text); font-weight: 500; }

.hud {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.hud-tile {
  background: var(--surface);
  padding: 1rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.hud-tile .n {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-weight: 500;
  font-size: 1.75rem;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.hud-tile .label {
  font-family: 'Oswald', system-ui, sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.hud-tile.done .n { color: var(--ok); }
.hud-tile.progress .n { color: var(--warn); }
.hud-tile.blocked .n { color: var(--blocked); }
.hud-tile.todo .n { color: var(--neutral); }

.org-bar {
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  display: flex;
  background: var(--neutral-soft);
  border: 1px solid var(--border);
}
.org-bar span { display: block; height: 100%; }
.org-bar .seg-done { background: var(--ok); }
.org-bar .seg-progress { background: var(--warn); }
.org-bar .seg-blocked { background: var(--blocked); }

/* ---------- Domain sections ---------- */

.domain-label {
  font-family: 'Oswald', system-ui, sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 0 0.9rem;
}
.domain-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.repo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 1rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.1rem 1.2rem 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  box-shadow: var(--shadow);
}

.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
}

.card-head .repo-name {
  font-family: 'Oswald', system-ui, sans-serif;
  font-weight: 600;
  font-size: 1.05rem;
  letter-spacing: 0.01em;
}

.card-head .pct {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: 0.85rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.card-head .pct strong { color: var(--text); font-weight: 500; }

.lifebar {
  height: 7px;
  border-radius: 3px;
  overflow: hidden;
  display: flex;
  gap: 1.5px;
  background: var(--neutral-soft);
}
.lifebar span { display: block; height: 100%; }
.lifebar .seg-done { background: var(--ok); }
.lifebar .seg-progress { background: var(--warn); }
.lifebar .seg-blocked { background: var(--blocked); }
.lifebar .seg-todo { background: var(--neutral); opacity: 0.45; }

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.chip {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
}
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.progress { background: var(--warn-soft); color: var(--warn); }
.chip.blocked { background: var(--blocked-soft); color: var(--blocked); }
.chip.todo { background: var(--neutral-soft); color: var(--text-dim); }

.task-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  max-height: 12.5rem;
  overflow-y: auto;
  border-top: 1px solid var(--border);
}

.task-list:empty { display: none; }

.task-list li {
  display: flex;
  align-items: baseline;
  gap: 0.55rem;
  padding: 0.42rem 0;
  border-bottom: 1px dashed var(--border);
  font-size: 0.83rem;
}
.task-list li:last-child { border-bottom: none; }

.task-id {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: 0.72rem;
  color: var(--text-dim);
  flex-shrink: 0;
}

.task-title { flex: 1; }

.dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  margin-top: 0.4em;
}
.dot.progress { background: var(--warn); }
.dot.blocked { background: var(--blocked); }
.dot.todo { background: var(--neutral); }

.empty-note {
  font-size: 0.8rem;
  color: var(--text-dim);
  font-style: italic;
  padding: 0.4rem 0 0.1rem;
}

/* ---------- Recent activity ---------- */

.recent {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.2rem 1.3rem 1.4rem;
  box-shadow: var(--shadow);
}

.recent h2 {
  font-family: 'Oswald', system-ui, sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 0 0 0.9rem;
}

.recent-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}

.recent-list li {
  display: grid;
  grid-template-columns: 6.5rem 1fr auto;
  gap: 0.9rem;
  align-items: baseline;
  padding: 0.5rem 0;
  border-bottom: 1px dashed var(--border);
  font-size: 0.85rem;
}
.recent-list li:last-child { border-bottom: none; }

.recent-repo {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: 0.72rem;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 4px;
  padding: 0.1rem 0.4rem;
  width: fit-content;
}

.recent-date {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: 0.72rem;
  color: var(--text-dim);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

footer {
  font-size: 0.75rem;
  color: var(--text-dim);
  text-align: center;
  padding-top: 1rem;
}

@media (prefers-reduced-motion: no-preference) {
  .card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
}

@media (max-width: 640px) {
  .hud { grid-template-columns: repeat(2, 1fr); }
  .title-row { flex-direction: column; align-items: flex-start; }
  .meta { text-align: left; }
}
</style>

<div class="wrap">
  <header class="masthead">
    <div class="title-row">
      <h1>État des tâches <span class="org">— OpenKakutou</span></h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="hud" id="hud"></div>
    <div class="org-bar" id="org-bar"></div>
  </header>

  <div id="domains"></div>

  <section class="recent">
    <h2>Dernières tâches terminées</h2>
    <ul class="recent-list" id="recent-list"></ul>
  </section>

  <footer>Généré depuis <code>.vibe/backlog/</code> sur chaque repo OpenKakutou. Rafraîchi automatiquement par une routine planifiée.</footer>
</div>

<script>
// GENERATED DATA — ce bloc est remplacé intégralement à chaque rafraîchissement.
// Tout le reste du fichier (CSS/HTML/JS ci-dessus et ci-dessous) doit rester inchangé.
const DATA = /*__DASHBOARD_DATA_JSON__*/;
const DOMAIN_LABEL = {"shared": "Partagé", "character": "Character", "stage": "Stage", "lifebar": "Lifebar", "org-wide": "Org / Engine", "mode": "Mode de jeu"};
</script>
<script>
(function() {
  const statusLabel = { todo: "à faire", in_progress: "en cours", blocked: "bloqué", done: "terminé" };

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // meta
  const genDate = new Date(DATA.generated_at);
  const meta = document.getElementById('meta');
  meta.innerHTML = 'Mise à jour <strong>' + genDate.toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' }) +
    ' à ' + genDate.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }) + '</strong>';

  // HUD tiles
  const hud = document.getElementById('hud');
  const tiles = [
    ['done', 'Terminées', DATA.totals.done],
    ['progress', 'En cours', DATA.totals.in_progress],
    ['blocked', 'Bloquées', DATA.totals.blocked],
    ['todo', 'À faire', DATA.totals.todo],
  ];
  tiles.forEach(([cls, label, n]) => {
    const t = el('div', 'hud-tile ' + cls);
    t.appendChild(el('div', 'n', String(n)));
    t.appendChild(el('div', 'label', label));
    hud.appendChild(t);
  });

  // org bar
  const orgBar = document.getElementById('org-bar');
  const tot = DATA.totals.total || 1;
  [['seg-done', DATA.totals.done], ['seg-progress', DATA.totals.in_progress], ['seg-blocked', DATA.totals.blocked]]
    .forEach(([cls, n]) => {
      if (n <= 0) return;
      const s = document.createElement('span');
      s.className = cls;
      s.style.width = (100 * n / tot) + '%';
      orgBar.appendChild(s);
    });

  // domains + repo cards
  const domainsEl = document.getElementById('domains');
  const byDomain = {};
  DATA.repos.forEach(r => {
    (byDomain[r.domain] = byDomain[r.domain] || []).push(r);
  });
  const domainOrder = ['shared','character','stage','lifebar','org-wide','mode'];

  domainOrder.filter(d => byDomain[d]).forEach(domain => {
    const section = el('section');
    section.appendChild(el('h2', 'domain-label', DOMAIN_LABEL[domain] || domain));
    const grid = el('div', 'repo-grid');

    byDomain[domain].forEach(r => {
      const card = el('div', 'card');

      const head = el('div', 'card-head');
      head.appendChild(el('div', 'repo-name', r.name));
      const pct = el('div', 'pct');
      pct.innerHTML = '<strong>' + r.pct_done + '%</strong> · ' + r.total + ' tâches';
      head.appendChild(pct);
      card.appendChild(head);

      const bar = el('div', 'lifebar');
      const rtot = r.total || 1;
      [['seg-done', r.done], ['seg-progress', r.in_progress], ['seg-blocked', r.blocked], ['seg-todo', r.todo]]
        .forEach(([cls, n]) => {
          if (n <= 0) return;
          const s = document.createElement('span');
          s.className = cls;
          s.style.width = (100 * n / rtot) + '%';
          bar.appendChild(s);
        });
      card.appendChild(bar);

      const chips = el('div', 'chip-row');
      const chipDefs = [
        ['done', 'terminé', r.done], ['progress', 'en cours', r.in_progress],
        ['blocked', 'bloqué', r.blocked], ['todo', 'à faire', r.todo]
      ];
      chipDefs.forEach(([cls, label, n]) => {
        if (n <= 0) return;
        chips.appendChild(el('span', 'chip ' + cls, n + ' ' + label));
      });
      card.appendChild(chips);

      if (r.pending.length) {
        const list = el('ul', 'task-list');
        r.pending.forEach(p => {
          const li = el('li');
          if (p.status !== 'todo') li.appendChild(el('span', 'dot ' + p.status));
          li.appendChild(el('span', 'task-id', '#' + p.id));
          li.appendChild(el('span', 'task-title', p.title));
          list.appendChild(li);
        });
        card.appendChild(list);
      } else {
        card.appendChild(el('div', 'empty-note', 'Backlog vide.'));
      }

      grid.appendChild(card);
    });

    section.appendChild(grid);
    domainsEl.appendChild(section);
  });

  // recent completions
  const recentList = document.getElementById('recent-list');
  DATA.recent_done_global.forEach(item => {
    const li = el('li');
    li.appendChild(el('span', 'recent-repo', item.repo));
    li.appendChild(el('span', '', item.title));
    li.appendChild(el('span', 'recent-date', fmtDate(item.date)));
    recentList.appendChild(li);
  });
})();
</script>
